<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeganAI | Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --dark: #0f1a0f;
            --accent: #81c784;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1a2a1a, #0f1a0f);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .auth-card {
            background: var(--glass);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 30px;
            font-weight: 800;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #a8dba8;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-light);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.2);
        }

        .btn-login:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(46, 125, 50, 0.4);
        }

        .error-msg {
            color: #ff5252;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <h2> Member Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••">
        </div>
        <button onclick="handleAuth()" class="btn-login">Login to Dashboard</button>
        <div id="error" class="error-msg">Invalid credentials. Please try again.</div>

        <p style="margin-top: 30px; color: #6d8a6d; font-size: 0.85rem;">
            Default Access: admin / 1234
        </p>
    </div>

    <script>
        async function handleAuth() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('error');

            const formData = new FormData();
            formData.append('username', user);
            formData.append('password', pass);

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });

                if (resp.ok) {
                    window.location.href = '/dashboard';
                } else {
                    error.style.display = 'block';
                }
            } catch (e) {
                error.style.display = 'block';
            }
        }
    </script>
</body>

</html>
